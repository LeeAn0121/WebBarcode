<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebBarcode - 실시간 스캐너</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- html5-qrcode -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- SheetJS (Excel) -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    
    <!-- Dynamic cache busting for CSS -->
    <script>
        document.write('<link rel="stylesheet" href="style.css?v=' + new Date().getTime() + '">');
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['"Fira Code"', 'monospace'],
                    },
                    colors: {
                        primary: '#6366f1', // Indigo 500
                        primaryHover: '#4f46e5', // Indigo 600
                        secondary: '#10b981',
                        darkBg: '#0f172a', // Slate 900
                        darkCard: '#1e293b' // Slate 800
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'glow': '0 0 15px rgba(99, 102, 241, 0.3)',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-darkBg text-slate-800 dark:text-slate-200 h-[100dvh] flex flex-col font-sans transition-colors duration-300 selection:bg-primary/30 antialiased">
    
    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 pointer-events-none w-full max-w-sm px-4"></div>

    <header class="bg-white/80 dark:bg-darkCard/80 backdrop-blur-md shadow-sm border-b border-slate-200/50 dark:border-slate-700/50 sticky top-0 z-50 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 sm:py-4 flex justify-between items-center">
            <div class="flex items-center gap-2 sm:gap-3">
                <div class="bg-gradient-to-br from-primary to-purple-500 text-white p-2 rounded-xl shadow-glow">
                    <i class="fa-solid fa-barcode text-lg sm:text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold text-slate-900 dark:text-white leading-tight tracking-tight">WebBarcode</h1>
                    <p class="text-[10px] sm:text-xs text-slate-500 dark:text-slate-400 font-medium hidden sm:block">Global Sync Scanner</p>
                </div>
            </div>
            <div class="flex items-center gap-3 sm:gap-4">
                <button id="theme-toggle" class="text-slate-400 hover:text-primary dark:hover:text-primary transition-colors text-lg sm:text-xl p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700" title="다크 모드 전환">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block"></i>
                </button>
                <button id="export-excel-btn" class="bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 hover:border-green-500 hover:text-green-600 dark:hover:border-green-400 dark:hover:text-green-400 text-slate-600 dark:text-slate-300 text-xs sm:text-sm font-medium py-2 px-3 sm:px-4 rounded-xl shadow-sm transition-all flex items-center gap-2" title="엑셀로 다운로드">
                    <i class="fa-solid fa-file-excel"></i> <span class="hidden sm:inline">내보내기</span>
                </button>
                <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-700/50 px-3 py-1.5 rounded-full border border-slate-200/50 dark:border-slate-600/50">
                    <span class="flex h-2.5 w-2.5 relative">
                      <span id="live-indicator-ping" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-secondary opacity-75"></span>
                      <span id="live-indicator" class="relative inline-flex rounded-full h-2.5 w-2.5 bg-secondary"></span>
                    </span>
                    <span id="connection-status" class="text-xs font-semibold text-slate-600 dark:text-slate-300 hidden sm:inline-block">Live</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-4 sm:py-6 lg:py-8 overflow-y-auto lg:overflow-hidden flex flex-col lg:flex-row gap-6">
        
        <section class="w-full lg:w-1/2 xl:w-5/12 flex flex-col shrink-0 lg:shrink">
            <div class="bg-white dark:bg-darkCard rounded-3xl shadow-soft border border-slate-100 dark:border-slate-700 overflow-hidden flex flex-col transition-colors duration-300 relative group">
                <!-- Decorative gradient background -->
                <div class="absolute -inset-0.5 bg-gradient-to-br from-primary/20 to-purple-500/20 opacity-0 group-hover:opacity-100 transition duration-500 blur-xl pointer-events-none"></div>
                
                <div class="relative z-10 flex flex-col h-full bg-white dark:bg-darkCard">
                    <div class="p-4 sm:p-5 border-b border-slate-50 dark:border-slate-700/50 flex justify-between items-center">
                        <h2 class="text-base sm:text-lg font-bold text-slate-800 dark:text-white flex items-center gap-2">
                            <i class="fa-solid fa-camera text-primary"></i> 카메라 스캔
                        </h2>
                        <button id="sound-toggle-btn" class="text-primary hover:text-primaryHover dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-500/10 hover:bg-indigo-100 dark:hover:bg-indigo-500/20 transition-colors p-2 rounded-full" title="소리 켜기/끄기">
                            <i class="fa-solid fa-volume-high text-sm w-4 h-4 flex items-center justify-center"></i>
                        </button>
                    </div>
                    
                    <div class="p-4 sm:p-6 flex flex-col items-center justify-center relative flex-1 bg-slate-50/30 dark:bg-slate-900/20">
                        <div id="camera-controls" class="w-full text-center z-10 mb-5">
                            <button id="request-camera-btn" class="bg-primary hover:bg-primaryHover text-white font-semibold py-3.5 px-6 rounded-2xl shadow-glow hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200 flex items-center justify-center gap-2 w-full max-w-xs mx-auto">
                                <i class="fa-solid fa-video"></i> 스캐너 활성화
                            </button>
                            <div class="relative w-full max-w-sm mx-auto mt-3 flex flex-col gap-3">
                                <div class="relative">
                                    <select id="camera-select" class="hidden w-full appearance-none bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-200 py-3 px-4 pr-10 rounded-xl leading-tight focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary shadow-sm transition-all text-sm font-medium">
                                    </select>
                                    <div id="camera-select-icon" class="hidden pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                                        <i class="fa-solid fa-chevron-down text-sm"></i>
                                    </div>
                                </div>
                                <!-- Zoom Control -->
                                <div id="zoom-control-container" class="hidden w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-xl p-3 shadow-sm flex items-center gap-3">
                                    <i class="fa-solid fa-magnifying-glass-minus text-slate-400 text-sm"></i>
                                    <input type="range" id="zoom-slider" min="1" max="1" step="0.1" value="1" class="w-full h-1.5 bg-slate-200 dark:bg-slate-600 rounded-lg appearance-none cursor-pointer accent-primary">
                                    <i class="fa-solid fa-magnifying-glass-plus text-slate-400 text-sm"></i>
                                </div>
                            </div>
                        </div>
                        
                        <div class="w-full relative rounded-2xl overflow-hidden shadow-inner bg-slate-900 ring-1 ring-slate-900/5 dark:ring-white/10">
                            <div id="reader" class="w-full" style="min-height: 250px;"></div>
                            <div id="reader-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400/80 bg-slate-900">
                                <div class="relative mb-4">
                                    <i class="fa-solid fa-qrcode text-6xl opacity-30"></i>
                                    <div class="absolute inset-0 border-2 border-dashed border-primary/50 rounded-lg animate-[spin_10s_linear_infinite]"></div>
                                </div>
                                <p class="text-sm font-medium">화면을 탭하여 시작하세요</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="w-full lg:w-1/2 xl:w-7/12 flex flex-col min-h-[400px] lg:min-h-0 lg:h-auto pb-6 lg:pb-0">
            <div class="bg-white dark:bg-darkCard rounded-3xl shadow-soft border border-slate-100 dark:border-slate-700 overflow-hidden flex-1 flex flex-col transition-colors duration-300">
                <div class="p-4 sm:p-5 border-b border-slate-50 dark:border-slate-700/50 flex flex-col gap-4">
                    <div class="flex justify-between items-center">
                        <h2 class="text-base sm:text-lg font-bold text-slate-800 dark:text-white flex items-center gap-2">
                            <i class="fa-solid fa-layer-group text-primary"></i> 스캔 히스토리
                        </h2>
                        <span id="scan-count" class="bg-primary/10 text-primary dark:bg-indigo-500/10 dark:text-indigo-400 text-xs font-bold px-3 py-1 rounded-full">0건</span>
                    </div>
                    
                    <!-- Search Bar -->
                    <div class="relative w-full group">
                        <div class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400 group-focus-within:text-primary transition-colors">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </div>
                        <input type="text" id="search-input" class="w-full bg-slate-50 dark:bg-slate-900/50 border-0 ring-1 ring-slate-200 dark:ring-slate-700 text-slate-900 dark:text-white text-sm rounded-xl focus:ring-2 focus:ring-primary block pl-10 p-3 transition-shadow placeholder:text-slate-400" placeholder="바코드 번호 또는 메모로 검색...">
                    </div>
                </div>
                
                <div class="flex-1 overflow-y-auto p-3 sm:p-4 bg-slate-50/50 dark:bg-slate-900/30 custom-scrollbar" id="barcode-list-container">
                    <ul id="barcode-list" class="space-y-3">
                        <div id="empty-state" class="flex flex-col items-center justify-center h-48 text-slate-400 dark:text-slate-500">
                            <div class="w-16 h-16 mb-4 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center">
                                <i class="fa-regular fa-folder-open text-2xl opacity-60"></i>
                            </div>
                            <p class="text-sm font-medium">아직 스캔된 기록이 없습니다</p>
                        </div>
                        <div id="no-results-state" class="hidden flex-col items-center justify-center h-48 text-slate-400 dark:text-slate-500">
                            <div class="w-16 h-16 mb-4 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center">
                                <i class="fa-solid fa-magnifying-glass text-2xl opacity-60"></i>
                            </div>
                            <p class="text-sm font-medium">검색 결과가 없습니다</p>
                        </div>
                    </ul>
                </div>
            </div>
        </section>
    </main>

    <!-- Dynamic cache busting for JS -->
    <script>
        const script = document.createElement('script');
        script.src = 'app.js?v=' + new Date().getTime();
        document.body.appendChild(script);
    </script>
</body>
</html>
