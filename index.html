<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>WebBarcode</title>
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="/icon.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
      <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
      <link rel="manifest" href="./manifest.json" /></head>
  <body>
    <div id="root"></div>
    <div id="static-splash" class="splash-container">
      <div class="aurora-blob blob-1"></div>
      <div class="aurora-blob blob-2"></div>
      <div class="aurora-blob blob-3"></div>
      
      <div class="splash-glass">
        <div class="splash-icon-container">
          <img src="./icon.jpg" alt="WebBarcode Logo" class="splash-icon" />
          <div class="splash-pulse"></div>
        </div>
        <h1 class="splash-title">WebBarcode</h1>
        <div class="splash-loader"></div>
      </div>

      <style>
        body { margin: 0; padding: 0; }
        .splash-container {
          position: fixed; inset: 0; z-index: 9999;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          background: #050505;
          overflow: hidden;
          font-family: Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }
        @media (prefers-color-scheme: light) {
          .splash-container { background: #f8f9fa; }
        }

        .aurora-blob {
          position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.6;
          mix-blend-mode: screen;
          animation: floatBlob 6s infinite alternate ease-in-out;
        }
        @media (prefers-color-scheme: light) {
          .aurora-blob { mix-blend-mode: multiply; opacity: 0.4; }
        }

        .blob-1 { width: 50vw; height: 50vw; background: rgba(167, 139, 250, 0.4); top: -10%; left: -10%; }
        .blob-2 { width: 40vw; height: 60vw; background: rgba(96, 165, 250, 0.4); top: 20%; right: -10%; animation-delay: -2s; }
        .blob-3 { width: 60vw; height: 50vw; background: rgba(52, 211, 153, 0.3); bottom: -20%; left: 20%; animation-delay: -4s; }

        @keyframes floatBlob {
          0% { transform: translate(0, 0) scale(1); }
          100% { transform: translate(20px, -30px) scale(1.1); }
        }

        .splash-glass {
          position: relative; z-index: 10;
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
          background: rgba(255, 255, 255, 0.6);
          border: 1px solid rgba(255, 255, 255, 0.4);
          backdrop-filter: blur(40px);
          -webkit-backdrop-filter: blur(40px);
          padding: 40px 60px;
          border-radius: 40px;
          box-shadow: 0 40px 100px -20px rgba(0,0,0,0.1);
          animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @media (prefers-color-scheme: dark) {
          .splash-glass {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 40px 100px -20px rgba(0,0,0,0.5);
          }
        }

        @keyframes popIn {
          0% { opacity: 0; transform: scale(0.9) translateY(20px); }
          100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .splash-icon-container {
          position: relative; width: 88px; height: 88px; border-radius: 24px;
          box-shadow: 0 10px 40px rgba(99, 102, 241, 0.3);
        }
        .splash-icon {
          width: 100%; height: 100%; border-radius: inherit; object-fit: cover;
          position: relative; z-index: 2;
        }
        .splash-pulse {
          position: absolute; inset: 0; border-radius: inherit;
          background: #6366f1; z-index: 1;
          animation: pulseGlow 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }

        @keyframes pulseGlow {
          0% { transform: scale(1); opacity: 0.8; }
          100% { transform: scale(1.4); opacity: 0; }
        }

        .splash-title {
          font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin: 0;
          background: linear-gradient(135deg, #6366f1, #a855f7);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }

        .splash-loader {
          width: 48px; height: 6px; border-radius: 3px;
          background: rgba(99, 102, 241, 0.2);
          overflow: hidden; position: relative;
        }
        .splash-loader::after {
          content: ''; position: absolute; top: 0; left: 0; height: 100%; width: 40%;
          background: #6366f1; border-radius: 3px;
          animation: loadBar 1.2s infinite ease-in-out;
        }
        @keyframes loadBar {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(300%); }
        }
      </style>
    </div>
    <script>
      // 404.html이 담아 보낸 원래 경로(예: /WebBarcode/admin)를 복원
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get('redirect');
        if (redirect) {
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then(reg => console.log('SW registered!', reg)).catch(err => console.log('SW registration failed', err));
        });
      }
    </script>
  </body>
</html>
