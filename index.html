<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>WebBarcode · 바코드 보관함</title>
    <meta name="description" content="카메라로 빠르게 스캔하고, 바코드를 폴더로 정리하는 나만의 작업 공간." />
    <meta name="theme-color" content="#6366f1" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
      <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
      <link rel="manifest" href="./manifest.json" /></head>
  <body>
    <div id="root"></div>
    <div id="static-splash" role="status" aria-label="앱을 불러오는 중">
      <strong>WebBarcode</strong><span>작업 공간을 준비하고 있어요.</span>
    </div>
    <style>
      body { margin: 0; }
      #static-splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #f7f8fc; color: #22243b; font-family: Pretendard, system-ui, sans-serif; }
      #static-splash strong { font-size: 28px; letter-spacing: -.04em; color: #6366f1; }
      #static-splash span { font-size: 14px; color: #677088; }
      html.dark #static-splash { background: #11131c; color: #eff0fa; }
      html.dark #static-splash span { color: #a1a8bc; }
    </style>
    <script>
      try { document.documentElement.classList.toggle('dark', localStorage.getItem('theme') === 'dark'); } catch (_) {}
    </script>
    <noscript>WebBarcode를 사용하려면 브라우저의 JavaScript를 활성화해 주세요.</noscript>
    <script>
      // 404.html이 담아 보낸 원래 경로(예: /WebBarcode/admin)를 복원
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get('redirect');
        if (redirect) {
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          // Force clear cache and unregister if ?refresh= is present
          if (window.location.search.includes('refresh=')) {
            try {
              const registrations = await navigator.serviceWorker.getRegistrations();
              for (const reg of registrations) {
                await reg.unregister();
              }
              const keys = await caches.keys();
              for (const key of keys) {
                await caches.delete(key);
              }
              console.log('SW & Caches cleared by refresh parameter');
            } catch (e) {
              console.error('Error clearing SW/Caches:', e);
            }
          }
          
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('SW registered!', reg))
            .catch(err => console.log('SW registration failed', err));
        });
      }
    </script>
  </body>
</html>
