<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>WebBarcode</title>
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="/icon.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
      <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
      <link rel="manifest" href="./manifest.json" /></head>
  <body>
    <div id="root"></div>
    <div id="static-splash" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#07070b;overflow:hidden;">
      <div style="position:absolute;inset:0;opacity:0.07;background-image:repeating-linear-gradient(90deg,#fff 0px,#fff 2px,transparent 2px,transparent 6px,#fff 6px,#fff 7px,transparent 7px,transparent 12px);"></div>
      <div style="position:relative;width:80px;height:80px;border-radius:16px;overflow:hidden;box-shadow:0 0 20px rgba(99,102,241,0.5);border:1px solid #1e293b;">
        <img src="./icon.jpg" alt="" style="width:100%;height:100%;object-fit:cover;display:block;" />
        <div id="static-splash-laser" style="position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#6366f1,transparent);box-shadow:0 0 20px rgba(99,102,241,0.5);top:10%;animation:static-splash-scan 2s cubic-bezier(0.4,0,0.2,1) infinite;"></div>
      </div>
      <h1 style="position:relative;font-size:20px;font-weight:700;color:#fff;letter-spacing:0.02em;font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;margin:0;">WebBarcode</h1>
      <style>
        @keyframes static-splash-scan { 0% { top: 10%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 90%; opacity: 0; } }
        @media (prefers-reduced-motion: reduce) { #static-splash-laser { animation: none; top: 50%; opacity: 1; } }
      </style>
    </div>
    <script>
      // 404.html이 담아 보낸 원래 경로(예: /WebBarcode/admin)를 복원
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get('redirect');
        if (redirect) {
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then(reg => console.log('SW registered!', reg)).catch(err => console.log('SW registration failed', err));
        });
      }
    </script>
  </body>
</html>
